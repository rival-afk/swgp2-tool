[package]
name = "swgp2-tool"
version = "3.2.0"
edition = "2021"
description = "All-in-one tool for Super Woden GP 2 (ViJuDa) - save editor, car database, skins browser"
license = "MIT"
repository = "https://github.com/rival-afk/swgp2-tool"
keywords = ["save-editor", "binaryformatter", "unity", "swgp2", "modding"]
categories = ["game-engines"]
default-run = "swgp2-tool"

[lib]
name = "swgp2_tool"
path = "src/lib.rs"

[[bin]]
name = "swgp2-tool"
path = "src/bin/swgp2-tool.rs"

[[bin]]
name = "swgp2-tui"
path = "src/bin/swgp2-tui.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
aes = "0.8"
cbc = "0.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rfd = "0.15"
ratatui = "0.29"
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["png", "tga", "jpeg"] }
