[package]
name = "swgp2-save-editor"
version = "2.0.0"
edition = "2021"
description = "Save file editor for Super Woden GP 2 (ViJuDa / SWGP2) - decrypt, edit, backup and re-encrypt .sav files"
license = "MIT"
repository = "https://github.com/rival-afk/swgp2-save-editor"
keywords = ["save-editor", "binaryformatter", "unity", "swgp2", "modding"]
categories = ["game-engines"]
default-run = "swgp2"

[lib]
name = "swgp2_save_editor"
path = "src/lib.rs"

[[bin]]
name = "swgp2"
path = "src/bin/swgp2.rs"

[[bin]]
name = "swgp2-tui"
path = "src/bin/swgp2-tui.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
aes = "0.8"
cbc = "0.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rfd = "0.15"
ratatui = "0.29"
crossterm = "0.28"
